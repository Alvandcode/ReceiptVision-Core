name: Windows portable package (no Docker needed)

# Builds a ready-to-run Windows folder and zips it:
#   ReceiptVision/
#     Start.bat / Stop.bat / README.txt   (double-click, no install)
#     app/receiptvision-core.jar          (built here with Maven)
#     jre/                                (portable Eclipse Temurin 17)
#     tesseract/                          (tesseract.exe + tessdata eng+fas)
#     data/                               (receipts database, created on run)
#
# Normal users download ONLY the zip from the Releases page.
# No Docker, no Java, no admin rights, no internet needed to run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-package:
    # Pinned: windows-latest moved and broke choco/tesseract provisioning
    # (v0.2.0-0.2.2 were green on windows-2022).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build jar (runs all tests)
        env:
          APP_JWT_SECRET: test-secret-0123456789-abcdef-0123456789
          JWT_EXPIRATION_HOURS: "1"
        run: mvn -B verify

      - name: Download portable JRE 17
        shell: pwsh
        run: |
          curl.exe -L -o jre.zip "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse"
          Expand-Archive jre.zip jre-tmp
          $inner = (Get-ChildItem jre-tmp | Select-Object -First 1).FullName
          Move-Item $inner jre
          .\jre\bin\java.exe -version

      - name: Get portable Tesseract + Persian data
        shell: pwsh
        run: |
          # Three independent install mechanisms: choco (green v0.2.0-0.2.2),
          # winget (official UB-Mannheim package), direct EXE silent install.
          # First one that yields tesseract.exe wins. Breadcrumbs via Write-Output
          # so the failing part is visible in logs without guesswork.
          $tessExe = 'C:\Program Files\Tesseract-OCR\tesseract.exe'
          function Find-Tesseract {
            foreach ($p in @(
              'C:\Program Files\Tesseract-OCR\tesseract.exe',
              'C:\Program Files (x86)\Tesseract-OCR\tesseract.exe')) {
              if (Test-Path $p) { return $p }
            }
            $hit = Get-ChildItem -Path "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" `
              -Filter 'tesseract.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { return $hit.FullName }
            return $null
          }
          $found = Find-Tesseract
          if (-not $found -and (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Output 'Trying choco install tesseract...'
            choco install tesseract --no-progress -y
            $found = Find-Tesseract
          }
          if (-not $found -and (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Output 'Trying winget UB-Mannheim.TesseractOCR...'
            winget install -e --id UB-Mannheim.TesseractOCR --silent `
              --accept-package-agreements --accept-source-agreements
            $found = Find-Tesseract
          }
          if (-not $found) {
            Write-Output 'Trying direct UB-Mannheim EXE silent install...'
            $exeUrl = 'https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe'
            curl.exe -sSL --retry 3 --connect-timeout 30 -o tess-setup.exe $exeUrl
            Start-Process -FilePath '.\tess-setup.exe' -ArgumentList '/S' -Wait
            Start-Sleep -Seconds 10
            $found = Find-Tesseract
          }
          if (-not $found) { throw 'tesseract.exe not found after choco+winget+direct attempts' }
          Write-Output "Found tesseract at: $found"
          $tessDir = Split-Path $found
          New-Item -ItemType Directory -Force tesseract | Out-Null
          Copy-Item (Join-Path $tessDir 'tesseract.exe') tesseract\
          Copy-Item -Recurse (Join-Path $tessDir 'tessdata') tesseract\
          curl.exe -sSL --retry 3 --connect-timeout 30 `
            -o tesseract\tessdata\fas.traineddata `
            'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/fas.traineddata'
          if (!(Test-Path tesseract\tessdata\fas.traineddata) `
            -or ((Get-Item tesseract\tessdata\fas.traineddata).Length -lt 100000)) {
            curl.exe -sSL --retry 3 --connect-timeout 30 `
              -o tesseract\tessdata\fas.traineddata `
              'https://github.com/tesseract-ocr/tessdata_fast/raw/main/fas.traineddata'
          }
          if (!(Test-Path tesseract\tessdata\fas.traineddata) `
            -or ((Get-Item tesseract\tessdata\fas.traineddata).Length -lt 100000)) {
            throw 'fas.traineddata download looks incomplete'
          }
          .\tesseract\tesseract.exe --list-langs

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ReceiptVision\app, ReceiptVision\data | Out-Null
          Copy-Item target\receiptvision-core.jar ReceiptVision\app\
          Copy-Item -Recurse jre ReceiptVision\
          Copy-Item -Recurse tesseract ReceiptVision\
          Copy-Item windows-package\* ReceiptVision\
          Compress-Archive -Path ReceiptVision -DestinationPath ReceiptVision-Windows.zip
          Get-ChildItem ReceiptVision-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReceiptVision-Windows
          path: ReceiptVision-Windows.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ReceiptVision-Windows.zip
          generate_release_notes: true
