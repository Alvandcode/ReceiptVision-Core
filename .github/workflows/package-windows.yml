name: Windows portable package (no Docker needed)

# Builds a ready-to-run Windows folder and zips it:
#   ReceiptVision/
#     Start.bat / Stop.bat / README.txt   (double-click, no install)
#     app/receiptvision-core.jar          (built here with Maven)
#     jre/                                (portable Eclipse Temurin 17)
#     tesseract/                          (tesseract.exe + tessdata eng+fas)
#     data/                               (receipts database, created on run)
#
# Normal users download ONLY the zip from the Releases page.
# No Docker, no Java, no admin rights, no internet needed to run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-package:
    # Pinned: windows-latest moved and broke choco/tesseract provisioning
    # (v0.2.0-0.2.2 were green on windows-2022).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build jar (runs all tests)
        env:
          APP_JWT_SECRET: test-secret-0123456789-abcdef-0123456789
          JWT_EXPIRATION_HOURS: "1"
        run: mvn -B verify

      - name: Download portable JRE 17
        shell: pwsh
        run: |
          curl.exe -L -o jre.zip "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse"
          Expand-Archive jre.zip jre-tmp
          $inner = (Get-ChildItem jre-tmp | Select-Object -First 1).FullName
          Move-Item $inner jre
          .\jre\bin\java.exe -version

      - name: Get portable Tesseract + Persian data
        shell: pwsh
        run: |
          # NOTE (root cause, tesseract-ocr/tesseract#4394): the UB-Mannheim 5.5.x
          # Windows installer (used by choco tesseract >= 5.5.3) FAILS its bundled
          # language-data download, leaving tessdata without eng.traineddata, so
          # `tesseract --list-langs` exits 1. Fix: install the ENGINE via choco,
          # but ship eng+fas ourselves from tessdata_fast (same as the Docker
          # image does with Debian tesseract-ocr-eng/fas packages).
          $tessExe = 'C:\Program Files\Tesseract-OCR\tesseract.exe'
          if (!(Test-Path $tessExe)) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install tesseract --no-progress -y
            }
          }
          if (!(Test-Path $tessExe)) {
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install -e --id UB-Mannheim.TesseractOCR --silent `
                --accept-package-agreements --accept-source-agreements
            }
          }
          if (!(Test-Path $tessExe)) { throw 'tesseract.exe not found after install attempts' }
          $tessDir = Split-Path $tessExe
          New-Item -ItemType Directory -Force tesseract | Out-Null
          Copy-Item (Join-Path $tessDir 'tesseract.exe') tesseract\
          Copy-Item -Recurse (Join-Path $tessDir 'tessdata') tesseract\ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force tesseract\tessdata | Out-Null
          # Copy runtime DLLs next to the exe (leptonica etc. ship beside it).
          Copy-Item (Join-Path $tessDir '*.dll') tesseract\ -ErrorAction SilentlyContinue
          # Authoritative language data: tessdata_fast works with Tesseract 5.x.
          foreach ($lang in @('eng', 'fas', 'osd')) {
            $dest = Join-Path 'tesseract\tessdata' ($lang + '.traineddata')
            $done = $false
            foreach ($base in @(
              'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main',
              'https://github.com/tesseract-ocr/tessdata_fast/raw/main')) {
              if ($done) { break }
              for ($i = 1; $i -le 3 -and -not $done; $i++) {
                curl.exe -sSL --retry 3 --connect-timeout 30 -o $dest ($base + '/' + $lang + '.traineddata')
                if ((Test-Path $dest) -and ((Get-Item $dest).Length -gt 50000)) { $done = $true }
                else { Start-Sleep -Seconds (5 * $i) }
              }
            }
            if (-not $done) { throw "language data download failed for: $lang" }
            Write-Output "$lang.traineddata OK ($((Get-Item $dest).Length) bytes)"
          }
          $langs = & .\tesseract\tesseract.exe --list-langs 2>&1 | Out-String
          Write-Output $langs
          if ($langs -notmatch 'eng' -or $langs -notmatch 'fas') {
            throw "tesseract language check failed, output was: $langs"
          }

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ReceiptVision\app, ReceiptVision\data | Out-Null
          Copy-Item target\receiptvision-core.jar ReceiptVision\app\
          Copy-Item -Recurse jre ReceiptVision\
          Copy-Item -Recurse tesseract ReceiptVision\
          Copy-Item windows-package\* ReceiptVision\
          Compress-Archive -Path ReceiptVision -DestinationPath ReceiptVision-Windows.zip
          Get-ChildItem ReceiptVision-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReceiptVision-Windows
          path: ReceiptVision-Windows.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ReceiptVision-Windows.zip
          generate_release_notes: true
