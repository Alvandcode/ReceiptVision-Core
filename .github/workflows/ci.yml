name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Tesseract + Persian data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fas tesseract-ocr-eng
          tesseract --list-langs

      - name: Build and test
        env:
          APP_JWT_SECRET: test-secret-0123456789-abcdef-0123456789
          JWT_EXPIRATION_HOURS: "1"
        run: mvn -B verify

      - name: Docker build smoke test
        run: docker build -t receiptvision:ci .
