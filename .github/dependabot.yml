version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Runtime must stay on Java 17 (project baseline). Never auto-jump major JDK.
      - dependency-name: "maven"
        versions: [">= 3.9.10-eclipse-temurin-18"]
      - dependency-name: "eclipse-temurin"
        versions: [">= 18"]
