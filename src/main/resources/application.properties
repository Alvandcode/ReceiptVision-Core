# ---- Server: PORT env is honored (fixes README/Docker mismatch) ----
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---- Datasource: file-based by default so /data volume actually persists ----
# Override with SPRING_DATASOURCE_URL env in production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:/data/receiptsdb;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1;AUTO_SERVER=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

# ---- JPA ----
# NOTE: `update` is convenient for this small H2-based service.
# For strict production use switch to `validate` + Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# ---- H2 console: OFF by default (security). Enable only for local dev: ----
#   H2_CONSOLE_ENABLED=true
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---- Upload limits: prevents OOM/DoS via huge images ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=1MB
app.upload.max-file-size=10485760

# ---- OCR ----
app.ocr.languages=${OCR_LANGUAGES:fas+eng}
app.ocr.psm=${OCR_PSM:3}
app.ocr.timeout-seconds=${OCR_TIMEOUT_SECONDS:30}
app.ocr.command=tesseract

# ---- Auth (strict per-user privacy) ----
# MUST be overridden in production with a random 32+ byte secret:
#   docker run -e APP_JWT_SECRET="$(openssl rand -base64 48)" ...
app.jwt.secret=${APP_JWT_SECRET:change-me-in-production-min-32-chars-please}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:168}

# ---- Actuator (used by Docker HEALTHCHECK) ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true

# ---- Logging ----
logging.level.com.receiptvision=INFO
logging.level.org.hibernate.SQL=WARN
