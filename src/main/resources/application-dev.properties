# Dev profile: in-memory DB + H2 console for fast local iteration.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# WARNING: dev enables H2 console. Never use dev profile with real sensitive data.
spring.datasource.url=jdbc:h2:mem:receiptsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
app.jwt.secret=test-dev-secret-0123456789-abcdef-0123456789
logging.level.com.receiptvision=DEBUG
